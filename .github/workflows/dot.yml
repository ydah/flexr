name: dot

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  dot:
    name: tooling / Graphviz DOT parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - run: bundle exec rake dot:verify
