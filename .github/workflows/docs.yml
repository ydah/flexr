name: docs

on:
  push:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"

jobs:
  docs:
    name: documentation / ruby 4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake docs:verify
