name: differential-fuzz

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  differential-fuzz:
    name: verification / fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:differential
        if: matrix.shard == 0
      - run: bundle exec rake fuzz
        env:
          FLEXR_FUZZ_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload verification failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-failures-${{ matrix.shard }}
          path: tmp/verification-failures/*.json
          if-no-files-found: ignore
