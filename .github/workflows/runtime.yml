name: runtime

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"

jobs:
  runtime:
    name: runtime / ${{ matrix.os }} / ruby ${{ matrix.ruby }} / ${{ matrix.jit }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0", head]
        jit: ["off", "on"]
        exclude:
          - os: windows-latest
            ruby: head
    env:
      RUBYOPT: ${{ matrix.jit == 'on' && '--yjit' || '' }}
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake modes:equivalence
      - run: bundle exec rake accel:equivalence
