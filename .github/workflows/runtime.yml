name: runtime

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  runtime:
    name: runtime / ${{ matrix.os }} / ruby ${{ matrix.ruby }} / ${{ matrix.jit }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ${{ fromJSON(github.event_name == 'schedule' && '["3.4","4.0","head"]' || '["3.4","4.0"]') }}
        jit: ["off", "on"]
        # RubyInstaller builds use the interpreter even with --yjit.
        exclude: >-
          ${{ fromJSON(github.event_name == 'schedule'
            && '[{"os":"windows-latest","ruby":"head"},{"os":"windows-latest","jit":"on"}]'
            || '[{"os":"macos-latest","jit":"on"},{"os":"windows-latest","jit":"on"}]') }}
    env:
      RUBYOPT: ${{ matrix.jit == 'on' && '--yjit' || '' }}
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the suite with coverage on Ubuntu Ruby 4.0
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '4.0' && matrix.jit == 'off'
        run: bundle exec rake coverage
      - name: Run the suite on other combinations
        if: matrix.os != 'ubuntu-latest' || matrix.ruby != '4.0' || matrix.jit != 'off'
        run: bundle exec rake test
      - run: bundle exec rake modes:equivalence
      - run: bundle exec rake accel:equivalence
