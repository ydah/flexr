name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  runtime:
    name: runtime / ${{ matrix.os }} / ruby ${{ matrix.ruby }} / ${{ matrix.jit }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", head]
        jit: ["off", "on"]
        exclude:
          - os: windows-latest
            ruby: head
    env:
      RUBYOPT: ${{ matrix.jit == 'on' && '--yjit' || '' }}
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rubocop
      - run: bundle exec rake modes:equivalence
      - run: bundle exec rake accel:equivalence

  generator:
    name: generator / ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3", "3.4", head]
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake golden:verify
      - run: bundle exec rake generated:verify
      - run: bundle exec rake dogfood:verify
      - run: bundle exec rake unicode:verify
      - run: bundle exec rake direct:verify
      - run: bundle exec rake examples:check
      - run: bundle exec rake coverage
      - run: bundle exec rake bench:regression

  nightly-fuzz:
    if: github.event_name == 'schedule'
    name: nightly / differential and fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:differential
      - run: bundle exec rake fuzz

  dot:
    name: tooling / Graphviz DOT parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - run: bundle exec rake dot:verify

  generated-ruby31:
    name: generated-only / ruby 3.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Load a generated lexer without the generator
        run: >-
          bundle exec ruby -Ilib -e
          'require "flexr"; load "spec/fixtures/generated.rb";
          lexer = GeneratedFixture::Lexer.new("42");
          abort "generated lexer mismatch" unless lexer.tokens == [[:INT, 42]]'
      - name: Load committed regexp tokenizer output
        run: >-
          bundle exec ruby -Ilib -e
          'require "flexr"; load "lib/flexr/regexp/tokenizer.rb";
          lexer = Flexr::Regexp::SourceLexer.new("a|[a-z]+\\p{L}?");
          expected = [[:LITERAL, "a"], [:ALTERNATION, "|"], [:CHAR_CLASS, "[a-z]"],
          [:QUANTIFIER, "+"], [:PROPERTY, "L"], [:QUANTIFIER, "?"]];
          abort "regexp tokenizer mismatch" unless lexer.tokens == expected'

  generated-alt-compatibility:
    name: generated-only / ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby, truffleruby]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Load a generated lexer without the generator
        run: >-
          bundle exec ruby -Ilib -e
          'require "flexr"; load "spec/fixtures/generated.rb";
          lexer = GeneratedFixture::Lexer.new("42");
          abort "generated lexer mismatch" unless lexer.tokens == [[:INT, 42]]'
      - name: Run the runtime specification without the generator
        run: >-
          bundle exec ruby -Ilib -e
          'require "flexr"; load "examples/json/lexer.flexr.rb";
          lexer = JsonExample::Lexer.new(%q({"answer":42}));
          abort "runtime lexer mismatch" unless lexer.tokens == [[:LBRACE, "{"], [:STRING, "answer"],
          [:COLON, ":"], [:NUMBER, 42.0], [:RBRACE, "}"]]'
