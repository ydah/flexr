name: types

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  types:
    name: public API / ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ["3.4", "4.0"]
    env:
      BUNDLE_GEMFILE: gemfiles/types.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rbs -I sig validate
      - run: bundle exec steep check --jobs=2
