name: types

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  types:
    name: public API / ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    env:
      BUNDLE_GEMFILE: gemfiles/types.gemfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rbs -I sig validate
      - run: bundle exec steep check --jobs=2
